<!DOCTYPE html>
<html>
  <head>
    <script src="/wise/js/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>
    <script src="chat.js"></script>

    <script src="//netdna.bootstrapcdn.com/bootstrap/3.0.3/js/bootstrap.min.js"></script>
    <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.3/css/bootstrap.min.css"
	  rel="stylesheet" />

    <style>
        body {
           font-family: helvetica;
        }
	#login, #chat {
	   margin-top: 50px;
	   width: 800px;
	}
	#wrong-login-proto {
           display: none;
	}
	#chat {
	   display: none;
	}
 	.messages {
 	   height: 200px;
	   overflow: auto;
 	}
 	#members {
 	   height: 212px;
 	}
    </style>

  </head>
  <body>

    <div id="login" class="container">
      <div class="jumbotron">

	<h2>Wise chat example</h2>

	<p>
	  In this example, the browser holds a servant which is registered
	  in the server.  Once this is done, the server will make an
	  invocation on the registered servant.  None of the invocations
	  will have a response.
	</p>

	<div class="row">
	  <div class="col-lg-6 col-lg-offset-3">
	    <div class="input-group">
	      <input id="nickname" type="text" class="form-control" placeholder="nickname">
	      <span class="input-group-btn">
		<button id="login-button" class="btn btn-default" type="button"
			onClick="login()">Go!</button>
	      </span>
	    </div>
	  </div>
	</div>

      </div>

      <div id="wrong-login-proto" class="alert alert-danger alert-dismissable">
	<button type="button" class="close" data-dismiss="alert"
		aria-hidden="true">&times;</button>
	<strong>Error:</strong> Wrong nick name!
      </div>

    </div>

    <div id="chat" class="container">

      <div>
	<div class="row">
	  <div class="col-lg-8">

	    <div class="panel panel-default">

	      <div id="notepad">
		<div id="messages-Channel" class="messages panel-body"></div>
	      </div>

	      <div class="panel-footer">

		<div class="input-group">
		  <input id="content" type="text" class="form-control">
		  <span class="input-group-btn">
		    <button class="btn btn-default" type="button"
			    onClick="send_message()">send!</button>
		  </span>
		</div>

	      </div>
	    </div>
	  </div>

	  <div class="col-lg-4">

	    <div id="members" class="list-group">
	      <a href="#" class="list-group-item active" onClick="select_member(this)">Channel</a>
	    </div>

	  </div>
	</div>
      </div>

      <p>(Control-F5 forces page refresh)</p>

    </div>
  </body>
</html>

<html>
  <body style="font-family: helvetica; width: 600px"">

    <script src="/wise/js/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>

    <h3>Wise chat example</h3>

    <p>
      In this example, the browser holds a servant which is registered
      in the server.  Once this is done, the server will make an
      invocation on the registered servant.  None of the invocations
      will have a response.
    </p>

    <h4>Server Messages</h4>
    <div id="messages" style="border: 1px solid #CCC; padding:5px; height:200px"></div>
    <input id="content" type="text" value=""/>
    <button onClick="send_to_chat()">send!</button>

    <p>
       (Control-F5 forces page refresh)
    </p>

    <script type="text/javascript">
    Servant = Class.extend({
	// args: message
	send: function(args) {
	    $('#messages').append("{0}: {1}<br/>".format(args.nick, args.message));
	},
    });

    // create the entry point which will be called automatically
    function wise_application(args) {
	ws = args.communicator;

	// create an object adapter to register our servant
	ws.createObjectAdapter({
	    name: "WebAdapter",
	    endpoint: "-w browser",
	    callback: { response: on_adapter_ready },
	});

	// create a proxy to the remote object
	ws.stringToProxy({
	    proxy: "chat1 -h 127.0.0.1 -p 8080 -w ws1",
            callback: { response: function(response) {
                // store it globally, as it would be used on UI callbacks
	        chat = response.proxy;
	    }},
	});

	// response: proxy
	function on_chat_stringToProxy_response(response) {
	    // store it globally, as it would be used on UI callbacks
	    chat = response.proxy;
	}

	// args: adapter
	function on_adapter_ready(args) {

	    // register servant on adapter
	    var observer = args.adapter.addWithUUID({ servant: new Servant() });

	    // create a proxy to observable in server
	    ws.stringToProxy({
		proxy: "chat1 -w ws1",
		callback: { response: function(args) {
		    args.proxy.subscribe({
			params: { observer: observer.toString() },
			callback: { response: ws.ready },
		    });
		}}
	    });
	}
    }

    // UI callbacks
    function send_to_chat() {
	var message = $('#content').val();

	// send message using the obtained proxy
	chat.send_to_all({
	    params: { nick: "client", message: message }
	});
    }
    </script>

  </body>
</html>

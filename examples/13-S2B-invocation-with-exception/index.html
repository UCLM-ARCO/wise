<html>
  <body style="font-family: helvetica">

    <script src="/wise/js/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>

    <h3>13: Server to Browser, invocation with exception</h3>

    This example will send an invocation from server to browser, and browser will<br>
    raise an exception, which will be sent back to server.<br>
    <br>

    <script type="text/javascript">
    Servant = Class.extend({
	init: function() {
	    this.counter = 0;
	},

	throw_exception: function() {
	    this.counter++;
	    throw { message: "this is a js exception ({0})".format(this.counter) };
	},
    });

    // create the entry point which will be called automatically
    function wise_application(args) {
	ws = args.communicator;

	// create an object adapter to register our servant
	ws.createObjectAdapter({
	    name: "WebAdapter",
	    endpoint: "-w browser",
	    callback: { response: on_adapter_ready },
	});

	// args: adapter
	function on_adapter_ready(args) {

	    // register servant on adapter
	    args.adapter.add({
		servant: new Servant(),
		identity: "Excepter",
	    });

	    // notify that this part is ready
	    ws.ready();
	}
    }

    </script>

  </body>
</html>

<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <title>Browser sent method invocation to server</title>
  </head>
  <body>

    <script src="http://code.jquery.com/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>

    <script type="text/javascript">
    function wise_application(ws) {
	ws.stringToProxy("Server -w ws").on_response(on_stringToProxy_response);

	function on_stringToProxy_response(proxy) {
	    log.info("Server '" + proxy + "'");
	    banner = proxy;
	};
    };

    // UI callbacks
    function on_set_clicked() {
	var message = $('#banner').val();
	banner.set_message(message);
    }

    function on_get_clicked() {
	banner.get_message().on_response(function(message) {
	    $('#banner').val(message);
	});
    }
    </script>

    Banner: <input type="text" id="banner" value="the message" /><br>

    <button id="set_button" onClick="on_set_clicked()">set</button>
    <button id="get_button" onClick="on_get_clicked()">get</button>

  </body>
</html>

<html>
  <body style="font-family: helvetica">

    <script src="/wise/js/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>

    <h3>22: Browser to Server, invocation with response</h3>

    This example will send an invocation from browser to server, and server will<br>
    send back some response. It will use the content of the text input below.</br>
    <br/>

    <input id="content" type="text" value="12.5"/>
    <button onClick="submit_message()">Submit</button>

    <br><br>
    <b>Responses from Server:</b><br>
    <div id="responses" style="border: 1px solid #CCC; padding: 5px"></div>

    <script type="text/javascript">
    // create the entry point which will be called automatically
    function wise_application(args) {
	ws = args.communicator;

	// create a proxy to object in server
	ws.stringToProxy({
	    proxy: "Server -h 127.0.0.1 -p 8080 -w ws",
	    callback: { response: on_stringToProxy_response },
	});

	// response: proxy
	function on_stringToProxy_response(response) {
	    // store it globally, as it would be used on UI callbacks
	    remote = response.proxy;
	}
    }

    // UI callbacks
    function submit_message() {
	var message = $('#content').val();

        var value = parseInt(message);
        remote.absa({
            params: {value: value},
            callback: {
		response: function(args) {
		    $('#responses').prepend("response: '{0}'<br/>".format(args.result));
		}
	    },
        });
    }
    </script>

  </body>
</html>

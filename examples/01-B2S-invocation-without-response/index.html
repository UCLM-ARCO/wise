<html>
  <body style="font-family: helvetica">

    <script src="/wise/js/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>

    <h3>01: Browser to Server, invocation without response</h3>

    This example will send an invocation from browser to server.<br>
    It will use the content of the input below.</br>
    <br>

    <input id="content" type="text" value="Hello, World!"/>
    <button onClick="submit_message()">Submit</button>

    <script type="text/javascript">
    // create the entry point which will be called automatically
    function wise_application(args) {
	ws = args.communicator;

	// create a proxy to object in server
	ws.stringToProxy({
	    proxy: "Server -w ws -h 127.0.0.1 -p 8080",
	    on_response: on_stringToProxy_response
	});

	// response: proxy
	function on_stringToProxy_response(response) {
	    // store it globally, as it would be used on UI callbacks
	    remote = response.proxy;
	}
    }

    // UI callbacks
    function submit_message() {
	var message = $('#content').val();

	// send message using the obtained proxy
	remote.set_message({
	    params: { message: message }
	});
    }
    </script>

  </body>
</html>

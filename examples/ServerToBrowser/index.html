<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <title>Server sent method invocation to browser</title>
  </head>
  <body>

    <script src="http://code.jquery.com/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>

    <script type="text/javascript">

      BannerI = Class.extend({
	  // args: message
	  set_message: function(args) {
	      $('#banner').val(args.message);
	  },

	  get_message: function() {
	      return $('#banner').val();
	  },
      });

      // create communicator and proxy to server
      $(window).ready(function() {
	  wise.initialize({ on_ready: on_communicator_ready });

 	  // args: communicator
 	  function on_communicator_ready(args) {
	      // create adapter
	      args.communicator.createObjectAdapter({
		  name: "WebAdapter",
		  endpoint: "-w browser",
		  on_response: on_adapter_ready,
	      });
	  }

	  // args: adapter
	  function on_adapter_ready(args) {
	      var servant = new BannerI();
	      args.adapter.add({
	      	  servant: servant,
	      	  identity: "Banner",
	      });

	      // notify that I am ready
	      $('#ready').prop("checked", true);
	  }

      });

    </script>

    Banner: <input type="text" id="banner" value="old message" /><br>

    <!-- this is a flag to notify that I am ready -->
    <input type="checkbox" id="ready" style="display:none" />

  </body>
</html>

<html>
  <body style="font-family: helvetica">

    <script src="/wise/js/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>

    <h3>05: B2S and S2B, registering an observer</h3>

    In this example, the browser holds a servant which is registered in the server.</br>
    Once this is done, the server will make an invocation on the registered servant.</br>
    None of the invocations will have a response.<br>
    <br>

    <b>Server Messages:</b><br>
    <div id="messages" style="border: 1px solid #CCC; padding: 5px"></div>

    <script type="text/javascript">
    Servant = Class.extend({
	// args: message
	set_message: function(args) {
	    $('#messages').prepend("'{0}'<br>".format(args.message));
	},
    });

    // create the entry point which will be called automatically
    function wise_application(args) {
	ws = args.communicator;

	// create an object adapter to register our servant
	ws.createObjectAdapter({
	    name: "WebAdapter",
	    endpoint: "-w browser",
	    callback: { response: on_adapter_ready },
	});

	// args: adapter
	function on_adapter_ready(args) {

	    // register servant on adapter
	    var observer = args.adapter.addWithUUID({ servant: new Servant() });

	    // create a proxy to observable in server
	    ws.stringToProxy({
		proxy: "Observable -w ws",
		callback: { response: function(args) {
		    args.proxy.attach({
			params: { observer: observer.toString() },
			callback: { response: ws.ready },
		    });
		}}
	    });
	}
    }
    </script>

  </body>
</html>

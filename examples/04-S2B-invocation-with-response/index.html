<html>
  <body style="font-family: helvetica">

    <script src="/wise/js/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>

    <h3>04: Server to Browser, invocation with response</h3>

    In this example, the server will send invocations to browser, and browser will<br>
    response something. The content of invocations will be shown below.</br>
    <br>

    <b>Server Messages:</b><br>
    <div id="messages" style="border: 1px solid #CCC; padding: 5px"></div>

    <script type="text/javascript">
    Servant = Class.extend({
	// args: message
	set_message: function(args) {
	    var retval = this._get_used_chars(args.message);
	    $('#messages').prepend("'{0}', returned: '{1}'<br>".format(
		args.message, retval));

	    return retval;
	},

	_get_used_chars: function(msg) {
	    var regexp = /^[a-zA-Z]$/;
	    var chars = [];
	    var i = msg.length;

	    while (i--) {
		var c = msg[i];
		if (regexp.test(c) && chars.indexOf(c) == -1)
		    chars.push(c);
	    }

	    chars.sort();
	    return chars.join("");
	},
    });

    // create the entry point which will be called automatically
    function wise_application(args) {
	ws = args.communicator;

	// create an object adapter to register our servant
	ws.createObjectAdapter({
	    name: "WebAdapter",
	    endpoint: "-w browser",
	    on_response: on_adapter_ready,
	});

	// args: adapter
	function on_adapter_ready(args) {

	    // register servant on adapter
	    args.adapter.add({
		servant: new Servant(),
		identity: "Message",
	    });

	    // notify that this part is ready
	    ws.ready();
	}
    }
    </script>

  </body>
</html>

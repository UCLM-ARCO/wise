<html>
  <body style="font-family:helvetica; width:600px">
    <script src="/wise/js/wise.js"></script>

    <h3>02: Browser to Server, return proxy and invoke it</h3>

    <p>
    This example will send an invocation from server to browser. Browser will return a proxy to server  and then server will send back a invocation.
    </p>

    <h4>Server replies</h4>

    <div id="messages" style="border: 1px solid #CCC; padding: 5px"></div>

    <script type="text/javascript">
    function prepend(id, text) {
        div = document.getElementById(id);
        div.innerHTML = text + div.innerHTML;
    }

    Servant = Class.extend({
	set_message: function(message) {
            prepend('messages', message + '<br/>');
	},
	get_proxy: function() {

	    browser_proxy = browser_adapter.add(new Servant(), "obj2");
	    return browser_proxy;
	}
    });

    function wise_application(ws) {
	broker = ws;
	ws.createObjectAdapter("WebAdapter", "-w browser")
	    .then(on_adapter_ready);

	function on_adapter_ready(adapter) {
	    browser_adapter = adapter;
	    browser_proxy = adapter.add(new Servant(), "obj1");
	    ws.ready();
	}
    }
    </script>

  </body>
</html>

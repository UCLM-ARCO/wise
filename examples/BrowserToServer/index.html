<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <title>Browser sent method invocation to server</title>
  </head>
  <body>

    <script src="http://code.jquery.com/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>

    <script type="text/javascript">

    // create communicator and proxy to server
    $(window).ready(function() {
	wise.initialize({
	    host: "127.0.0.1",
	    port: 7000,
	    on_ready: on_communicator_ready,
	});

	// response: communicator
	function on_communicator_ready(response) {
	    response.communicator.stringToProxy({
		proxy: "Server -w ws -h 127.0.0.1 -p 7000",
		on_response: on_stringToProxy_response
	    });
	};

	// response: proxy
	function on_stringToProxy_response(response) {
	    log.info("Server @ '" + response.proxy + "'");
	    banner = response.proxy;
	};
    });

    // UI callbacks
    function on_set_clicked() {
	var message = $('#banner').val();
	banner.set_message({
	    params: { message: message }
	});
    }

    function on_get_clicked() {
	banner.get_message({
	    on_response: function(args) {
		$('#banner').val(args.result);
	    }
	});
    }

    </script>

    Banner: <input type="text" id="banner" value="the message" /><br>

    <input type="button" id="set_button" value="set"
           onClick="on_set_clicked()" />

    <input type="button" id="get_button" value="get"
           onClick="on_get_clicked()" />

  </body>
</html>

<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <title>Server sent method invocation to browser</title>
  </head>
  <body>

    <script src="http://code.jquery.com/jquery-1.9.1.min.js"></script>
    <script src="/wise/js/class.js"></script>
    <script src="/wise/js/wise.js"></script>

    <script type="text/javascript">

      BannerI = Class.extend({
	  // args: message
	  set_message: function(args) {
	      $('#banner').val(args.message);
	  },

	  get_message: function() {
	      return $('#banner').val();
	  },
      });

      function wise_application(args) {
	  ws = args.communicator;

	  console.log(location.host);
	  ws.createObjectAdapter({
	      name: "WebAdapter",
	      endpoint: "-w browser",
	      on_response: on_adapter_ready,
	  });

	  // args: adapter
	  function on_adapter_ready(args) {
	      var servant = new BannerI();
	      args.adapter.add({
	      	  servant: servant,
	      	  identity: "Banner",
	      });

	      // notify that I am ready
	      ws.ready();
	  }

      }
    </script>

    Banner: <input type="text" id="banner" value="old message" /><br>

  </body>
</html>

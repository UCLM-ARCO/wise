<html>
  <body style="font-family: helvetica">
    <script src="/wise/js/wise.js"></script>

    <h3>Test: Browser to Server</h3>

    <h4>Server Messages</h4>
    <input id="response" value="initial value" style="border: 1px solid #CCC; padding: 5px"></div>

    <p>
    If click on "send a proxy!" button, browser will send a proxy to server and  invoke proxy server.
    If click on "get and invoke proxy"
    </p>


    <p>
       (Control-F5 forces page refresh)
    </p>

    <button id="send-proxy-button" onClick="send_proxy()">send a proxy!</button>
    <button id="get-proxy-button" onClick="submit_message()">get and invoke proxy</button>

    <script type="text/javascript">
    function prepend(id, text) {
        element = document.getElementById(id);
        element.value = text;
    }

    Servant = Class.extend({
	set_message: function(message) {
            prepend('response', message);
	},
	set_proxy: function(proxy) {
	    proxy.upper("example message")
		.then( function(reply) {
		    prepend('response', reply);
		});
        },
	get_proxy: function() {
     	   return browser_adapter.add(new Servant(), "obj2");
   	}
    });

    function wise_application(ws) {
	ws.stringToProxy("Server -w ws -h 127.0.0.1 -p 8080")
	    .then(on_stringToProxy_response);

	function on_stringToProxy_response(proxy) {
	    remote = proxy;
	}

	ws.createObjectAdapter("WebAdapter", "-w browser")
	    .then(on_adapter_ready);

	function on_adapter_ready(adapter) {
	    browser_adapter = adapter;
	    browser_proxy = adapter.add(new Servant(), "obj1");
	    ws.ready();
	}
    }

    function send_proxy() {
	remote.send_proxy(browser_proxy);
    }

    function submit_message() {
	remote.get_proxy()
	    .then(invoke_proxy);

	function invoke_proxy(proxy) {

	    proxy.upper("example message")
		.then(function(reply) {
		    prepend('response', reply);
		});
	}
    }
    </script>

  </body>
</html>

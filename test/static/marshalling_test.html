<html>
  <body>
    <script src="/wise/js/jquery-2.0.3.min.js"></script>
    <script src="/wise/js/wise.js"></script>

    <script type="text/javascript">
    Servant = Class.extend({
	set_number: function(args) { _number = args.number; },
	set_string: function(args) { _string = args.string; },
	set_boolean: function(args) { _boolean = args.state; },
	set_none: function(args) { _none = args.none; },
	set_array: function(args) { _array = args.array; },
	set_dictionary: function(args) { _dictionary = args.dictionary; },
	set_object: function(args) { _object = args.obj; },
    });

    function wise_application(args) {
	ws = args.communicator;

	// create an object adapter to register our servant
	ws.createObjectAdapter({
	    name: "WebAdapter",
	    endpoint: "-w browser",
	    on_response: on_adapter_ready,
	});

	// args: adapter
	function on_adapter_ready(args) {
	    args.adapter.add({
		servant: new Servant(),
		identity: "Marshall",
	    });

	    ws.ready();
	}
    }
    </script>
  </body>
</html>
